
 <!DOCTYPE html>
 <html>
    <head>
        <title>CountDown Timer</title>
        <style>

            body 
            {
                background-color:lightgrey;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                font-family: Arial, sans-serif;
            }

            .timer 
            {
                text-align: center;
                background: #fff;
                padding: 50px;
                border-radius: 10px;
                box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
            }

            .clock 
            {
                font-size: 40px;
                font-weight: bold;
                color: #333;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px;
            }

            .clock span.time-box 
            {
                background-color: blue;
                color: white;
                padding: 15px 20px;
                border-radius: 8px;
                min-width: 60px;
                text-align: center;
                display: inline-block;
            }

            .colon 
            {
                font-size: 40px;
                color:black;
                font-weight: bold;
            }
            .time-container 
            {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .label 
            {
                font-size: 18px;
                color: black;
                margin-top: 7px;
                font-weight: bold;
            }
            h1
            {
                text-align: center;
                margin: 50px 0;
                font-size: 30px;
                font-weight: bold;
            }


        </style>
    </head>
    <body>
        <h1>WAIT UNTIL </h1>

                
        <div class="timer">
            <div class="contain">
                <div class="clock">
                    <div class="time-container">
                        <span class="time-box" id="days">00</span>
                        <span class="label">Days</span>
                    </div>
                    <span class="colon">:</span>
                    <div class="time-container">
                        <span class="time-box" id="hrs">00</span>
                        <span class="label">Hours</span>
                    </div>
                    <span class="colon">:</span>
                    <div class="time-container">
                        <span class="time-box" id="min">00</span>
                        <span class="label">Minutes</span>
                    </div>
                    <span class="colon">:</span>
                    <div class="time-container">
                        <span class="time-box" id="sec">00</span>
                        <span class="label">Seconds</span>
                    </div>
                </div>
            </div>
        </div>

        <script>
                
            function countTime() 
            {
                

                var date = new Date();
                var target = new Date("11 12, 2025 12:00:00");
                var currentTime = date.getTime();
                var targetTime = target.getTime();

                var remtime = targetTime - currentTime;

                var sec = Math.floor(remtime / 1000);
                var min = Math.floor(sec / 60);
                var hrs = Math.floor(min / 60);
                var days = Math.floor(hrs / 24);

                hrs %= 24;
                min %= 60;
                sec %= 60;

                if (hrs < 10) 
                {
                    hrs = "0" + hrs;
                }
                if (min < 10) 
                {
                    min = "0" + min;
                }
                if (sec < 10) 
                {
                    sec = "0" + sec;
                }

                document.getElementById('days').textContent = days;
                document.getElementById('hrs').textContent = hrs;
                document.getElementById('min').textContent = min;
                document.getElementById('sec').textContent = sec;

                setTimeout(countTime, 1000);
            }

            countTime();
        </script>
        <h1>To ENJOY</h1>
    </body>
</html>
